# pgBackRest for the eduskript-db accessory. Runs as the postgres OS user inside
# the container (archive_command, and `docker exec -u postgres` from the host
# timers in scripts/ops/).
#
# repo1: local disk (/var/lib/eduskript/pgbackrest on the host) — point-in-time
#        restore over ~14 days: weekly full + daily diff, keep 2 fulls.
# repo2: Scaleway S3, encrypted — configured purely through PGBACKREST_REPO2_*
#        env vars once the bucket exists (see scripts/ops/README.md). While
#        unset, only repo1 is used. Retention there: 26 weekly fulls (6 months),
#        14 daily diffs, WAL only for the last 2 fulls.

[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
compress-type=zst
start-fast=y
process-max=2
log-level-console=info
log-level-file=detail

[eduskript]
pg1-path=/var/lib/postgresql/18/docker
pg1-user=eduskript
pg1-database=eduskript
pg1-socket-path=/var/run/postgresql
